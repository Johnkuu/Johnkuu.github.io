function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function decrypt(){
  const pw=document.getElementById("pw").value;
  if(!pw)return;
  document.getElementById("err").textContent="";
  try{
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT));
    const html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById("err").textContent="Väärä salasana"}
}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")decrypt()});
</script>
