<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root, [data-theme="dark"] {
    --bg:       #0e0f14;
    --surface:  #161820;
    --border:   #252733;
    --text:     #e8e9f0;
    --muted:    #6b6e85;
    --accent:   #f0c060;
    --btn-bg:   #252733;
    --btn-brd:  #2e3145;
    --btn-hov:  #2a2d42;
    --tt-bg:    #1d1f2e;
    --shadow:   rgba(0,0,0,.6);
  }
  [data-theme="light"] {
    --bg:       #f2f3f7;
    --surface:  #ffffff;
    --border:   #dde0ea;
    --text:     #1a1c28;
    --muted:    #7a7e96;
    --accent:   #b07010;
    --btn-bg:   #e8eaf2;
    --btn-brd:  #cdd0de;
    --btn-hov:  #d8dbe8;
    --tt-bg:    #ffffff;
    --shadow:   rgba(0,0,0,.12);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
    transition: background .2s, color .2s;
  }

  header {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 0 24px; height: 54px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0; gap: 10px;
    transition: background .2s, border-color .2s;
  }

  .logo { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--accent); white-space: nowrap; flex-shrink: 0; }
  .logo span { color: var(--text); }
  .toolbar { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

  .btn {
    background: var(--btn-bg); border: 1px solid var(--btn-brd); color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    padding: 5px 13px; border-radius: 6px; cursor: pointer;
    transition: background .15s; white-space: nowrap;
  }
  .btn:hover { background: var(--btn-hov); }
  .btn.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { background: transparent; border-color: #b03030; color: #d06060; }
  .btn.danger:hover { background: rgba(176,48,48,.1); }

  .theme-toggle {
    display: flex; align-items: center; gap: 7px;
    background: var(--btn-bg); border: 1px solid var(--btn-brd);
    border-radius: 20px; padding: 4px 11px 4px 6px;
    cursor: pointer; font-size: 11.5px; color: var(--muted);
    transition: all .15s; flex-shrink: 0; user-select: none;
  }
  .theme-toggle:hover { background: var(--btn-hov); color: var(--text); }
  .tgl-track {
    width: 30px; height: 17px; background: var(--border);
    border-radius: 9px; position: relative; transition: background .2s; flex-shrink: 0;
  }
  [data-theme="light"] .tgl-track { background: var(--accent); }
  .tgl-track::after {
    content: ''; position: absolute; top: 2.5px; left: 2.5px;
    width: 12px; height: 12px; background: #fff; border-radius: 50%;
    transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  [data-theme="light"] .tgl-track::after { left: 15.5px; }
  input[type=file] { display: none; }

  .layout { display: grid; grid-template-columns: 272px 1fr; flex: 1; overflow: hidden; }

  aside {
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
    transition: background .2s, border-color .2s;
  }

  .sidebar-hd {
    padding: 13px 17px 10px; border-bottom: 1px solid var(--border);
    font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--muted); display: flex; justify-content: space-between; align-items: center;
  }
  .count-badge { background: var(--btn-bg); border-radius: 10px; padding: 2px 8px; font-size: 11px; color: var(--text); font-family: 'DM Mono', monospace; }

  .event-list { flex: 1; overflow-y: auto; padding: 5px 0; }
  .event-list::-webkit-scrollbar { width: 4px; }
  .event-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .list-row {
    display: grid; grid-template-columns: 80px 1fr;
    gap: 5px; padding: 5px 14px; font-size: 11px;
    border-left: 3px solid transparent; cursor: default;
    transition: background .1s; align-items: start;
  }
  .list-row:hover { background: rgba(128,128,128,.05); }
  .list-date { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 9.5px; padding-top: 2px; line-height: 1.5; }
  .list-title { color: var(--text); line-height: 1.35; }
  .list-cat { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .3px; margin-top: 2px; opacity: .8; }

  .import-panel { padding: 10px; border-top: 1px solid var(--border); }
  .format-hint { font-size: 10px; color: var(--muted); margin-bottom: 7px; line-height: 1.65; }
  .format-hint code { background: var(--btn-bg); border-radius: 3px; padding: 1px 5px; font-family: 'DM Mono', monospace; font-size: 9.5px; color: var(--accent); }

  textarea {
    width: 100%; height: 78px; background: var(--bg);
    border: 1.5px solid var(--border); border-radius: 7px;
    color: var(--text); font-family: 'DM Mono', monospace;
    font-size: 10.5px; padding: 7px 9px; resize: none; outline: none;
    transition: border-color .15s, background .2s, color .2s; line-height: 1.5;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .import-btns { display: flex; gap: 6px; margin-top: 6px; }
  .import-btns .btn { flex: 1; text-align: center; font-size: 11px; padding: 5px 5px; }

  .legend { padding: 9px 14px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 5px 9px; }
  .leg-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  main { overflow: auto; background: var(--bg); transition: background .2s; }
  main::-webkit-scrollbar { height: 7px; width: 7px; }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  #export-target { padding: 40px 80px 60px 100px; display: inline-block; min-height: 100%; }

  /* ── EXPORT MODE: boost contrast so PNG text is sharp ── */
  [data-theme="light"] .exporting .ev-lbl      { color: #1a1c28 !important; }
  [data-theme="light"] .exporting .ev-date-lbl { color: #444860 !important; }
  [data-theme="light"] .exporting .cat-lbl     { color: #444860 !important; }
  [data-theme="light"] .exporting .yr-tick     { color: #444860 !important; }
  [data-theme="light"] .exporting .axis-bg,
  [data-theme="light"] .exporting .yr-tick::before { background: #8888a8 !important; }
  [data-theme="light"] .exporting .ev-stem     { background: #aaaacc !important; }
  [data-theme="dark"]  .exporting .ev-lbl      { color: #e8e9f0 !important; }
  [data-theme="dark"]  .exporting .ev-date-lbl { color: #b8bcd0 !important; }
  [data-theme="dark"]  .exporting .cat-lbl     { color: #b8bcd0 !important; }
  [data-theme="dark"]  .exporting .yr-tick     { color: #b8bcd0 !important; }
  [data-theme="dark"]  .exporting .axis-bg,
  [data-theme="dark"]  .exporting .yr-tick::before { background: #555870 !important; }
  [data-theme="dark"]  .exporting .ev-stem     { background: #555870 !important; }

  /* ── AXIS ── */
  .year-axis { position: relative; height: 28px; margin-bottom: 4px; }
  .axis-bg { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--border); }
  .yr-tick {
    position: absolute; top: 50%;
    transform: translate(-50%, -50%);
    font-family: 'DM Mono', monospace; font-size: 10px;
    color: var(--muted); white-space: nowrap; user-select: none;
  }
  .yr-tick::before { content: ''; display: block; width: 1px; height: 6px; background: var(--border); margin: 0 auto 3px; }

  /* ── ROWS ── */
  .tl-rows { position: relative; }

  /* each row is sized dynamically via JS (varies by number of stacking levels) */
  .tl-row { position: relative; }

  .cat-lbl {
    position: absolute; left: -74px;
    font-size: 9px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    text-align: right; width: 70px; top: 50%; transform: translateY(-50%);
    white-space: normal; word-break: break-word; line-height: 1.3; color: var(--muted);
  }
  .track { position: absolute; left: 0; right: 0; top: 50%; height: 2px; border-radius: 1px; opacity: .22; }

  /* ── EVENTS ── */
  .ev { position: absolute; cursor: pointer; z-index: 4; }
  .ev-dot {
    width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--bg);
    transition: transform .15s; position: relative; z-index: 2;
    margin: 0 auto;
  }
  .ev:hover .ev-dot { transform: scale(1.65); }

  /* stem connecting dot to label */
  .ev-stem { width: 1px; background: var(--border); margin: 0 auto; }

  .ev-lbl {
    white-space: nowrap; font-size: 10px; color: var(--text);
    text-align: center; pointer-events: none; line-height: 1.3;
    padding: 0 2px;
  }
  .ev-date-lbl { display: block; font-family: 'DM Mono', monospace; font-size: 8.5px; color: var(--muted); margin-bottom: 1px; }

  /* tooltip */
  .tt {
    position: fixed; background: var(--tt-bg); border: 1px solid var(--border);
    border-radius: 9px; padding: 10px 14px; font-size: 12px;
    pointer-events: none; z-index: 9999; max-width: 260px;
    box-shadow: 0 10px 36px var(--shadow); opacity: 0; transition: opacity .1s;
  }
  .tt.show { opacity: 1; }
  .tt-title { font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
  .tt-date  { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; }
  .tt-time  { color: var(--accent); font-family: 'DM Mono', monospace; font-size: 11px; margin-top: 2px; }
  .tt-cat   { font-size: 10px; font-weight: 700; margin-top: 7px; letter-spacing: .5px; text-transform: uppercase; }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; gap: 12px; color: var(--muted); font-size: 14px; }
  .empty-icon  { font-size: 38px; opacity: .35; }

  .notif {
    position: fixed; bottom: 22px; right: 22px; background: var(--tt-bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 15px;
    font-size: 12.5px; z-index: 9999; transform: translateY(16px); opacity: 0;
    transition: all .22s; pointer-events: none; box-shadow: 0 6px 24px var(--shadow);
  }
  .notif.show { transform: translateY(0); opacity: 1; }
  .notif.ok   { border-color: #4ecb8d; color: #4ecb8d; }
  .notif.err  { border-color: #e05c7a; color: #e05c7a; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .ev { animation: fadeUp .28s ease both; }
</style>
</head>
<body>

<header>
  <div class="logo">time<span>line</span></div>
  <div class="toolbar">
    <label class="btn" for="excel-file">📂 Import Excel / CSV</label>
    <input type="file" id="excel-file" accept=".csv,.xlsx,.xls,.tsv">
    <button class="btn" id="load-sample">Load sample data</button>
    <button class="btn danger" id="clear-btn">✕ Clear</button>
    <button class="btn primary" id="export-btn">↓ Export PNG</button>
    <button class="theme-toggle" id="theme-toggle">
      <div class="tgl-track"></div>
      <span id="theme-label">Light</span>
    </button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-hd">Events <span class="count-badge" id="count-badge">0</span></div>
    <div class="event-list" id="event-list">
      <div class="empty-state"><div class="empty-icon">📋</div>No events yet</div>
    </div>
    <div class="import-panel">
      <div class="format-hint">
        Paste CSV / tab-separated:<br>
        <code>Date, Category, Event</code><br>
        Supported formats:<br>
        <code>dd.mm.yyyy</code> &nbsp; <code>dd.mm.yyyy hh:mm:ss</code><br>
        <code>yyyy-mm-dd</code> &nbsp; <code>mm/yyyy</code> &nbsp; <code>yyyy</code><br>
        <span style="color:var(--accent)">◆</span> Events with identical date + name across categories are linked automatically.
      </div>
      <textarea id="paste-area" placeholder="Paste data here…"></textarea>
      <div class="import-btns">
        <button class="btn" id="import-paste-btn">↑ Import pasted</button>
        <button class="btn" id="append-btn">+ Append</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </aside>

  <main>
    <div id="export-target">
      <div class="empty-state" id="canvas-empty">
        <div class="empty-icon">🗓</div>
        Import or paste data to render the timeline
      </div>
      <div id="timeline-canvas" style="display:none"></div>
    </div>
  </main>
</div>

<div class="tt" id="tooltip">
  <div class="tt-title" id="tt-t"></div>
  <div class="tt-date"  id="tt-d"></div>
  <div class="tt-time"  id="tt-time" style="display:none"></div>
  <div class="tt-cat"   id="tt-c"></div>
</div>
<div class="notif" id="notif"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const PALETTE = [
  "#5b8dee","#e05c7a","#4ecb8d","#c47be0","#e07a3c",
  "#d4a030","#3ec9c9","#e08080","#90c060","#b070e0"
];

// Layout constants
const DOT_SIZE      = 11;   // px
const LABEL_HEIGHT  = 32;   // px per label block (date + title)
const STEM_MIN      = 6;    // px minimum stem
const LEVEL_HEIGHT  = LABEL_HEIGHT + STEM_MIN + DOT_SIZE / 2; // height per stacking level
const ROW_PADDING   = 20;   // px above/below track
const MIN_TICK_PX   = 60;   // minimum pixels between axis ticks

let events = [];
let catMap  = {};
const html  = document.documentElement;

// ── Theme ──────────────────────────────────────────────────────────────────────
document.getElementById('theme-toggle').addEventListener('click', () => {
  const goLight = html.dataset.theme === 'dark';
  html.dataset.theme = goLight ? 'light' : 'dark';
  document.getElementById('theme-label').textContent = goLight ? 'Dark' : 'Light';
});

function notify(msg, type='ok') {
  const el = document.getElementById('notif');
  el.textContent = msg; el.className = `notif ${type} show`;
  setTimeout(() => el.classList.remove('show'), 2800);
}

function pad2(n) { return String(n).padStart(2,'0'); }

// ── Date parsing ───────────────────────────────────────────────────────────────
function parseDate(raw) {
  if (!raw) return null;
  const s = raw.trim();

  // dd.mm.yyyy hh:mm[:ss]
  let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2})[:\.](\d{2})(?:[:\.](\d{2}))?/);
  if (m) {
    const d=+m[1],mo=+m[2],y=+m[3],h=+m[4],mi=+m[5],sc=m[6]?+m[6]:0;
    return { year_frac: y+(mo-1)/12+(d-1)/365.25+h/8766+mi/525960+sc/31557600,
      date_label: pad2(d)+'.'+pad2(mo)+'.'+y, time_label: pad2(h)+':'+pad2(mi)+(m[6]?':'+pad2(sc):''), has_time:true };
  }
  // dd.mm.yyyy
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (m) {
    const d=+m[1],mo=+m[2],y=+m[3];
    return { year_frac: y+(mo-1)/12+(d-1)/365.25, date_label: pad2(d)+'.'+pad2(mo)+'.'+y, time_label:null, has_time:false };
  }
  // yyyy-mm-dd [hh:mm[:ss]]
  m = s.replace('T',' ').match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:\s+(\d{1,2})[:\.](\d{2})(?:[:\.](\d{2}))?)?/);
  if (m) {
    const y=+m[1],mo=+m[2],d=+m[3];
    if (m[4]!==undefined) {
      const h=+m[4],mi=+m[5],sc=m[6]?+m[6]:0;
      return { year_frac: y+(mo-1)/12+(d-1)/365.25+h/8766+mi/525960,
        date_label: pad2(d)+'.'+pad2(mo)+'.'+y, time_label: pad2(h)+':'+pad2(mi)+(m[6]?':'+pad2(sc):''), has_time:true };
    }
    return { year_frac: y+(mo-1)/12+(d-1)/365.25, date_label: pad2(d)+'.'+pad2(mo)+'.'+y, time_label:null, has_time:false };
  }
  // mm/yyyy or mm-yyyy
  m = s.match(/^(\d{1,2})[\/\-](\d{4})$/);
  if (m) { const mo=+m[1],y=+m[2]; return { year_frac:y+(mo-1)/12, date_label:pad2(mo)+'/'+y, time_label:null, has_time:false }; }
  // yyyy-mm
  m = s.match(/^(\d{4})-(\d{1,2})$/);
  if (m) { const y=+m[1],mo=+m[2]; return { year_frac:y+(mo-1)/12, date_label:pad2(mo)+'/'+y, time_label:null, has_time:false }; }
  // month name
  const MN={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,
    january:1,february:2,march:3,april:4,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
  m = s.toLowerCase().match(/([a-z]+)\s+(\d{4})|(\d{4})\s+([a-z]+)/);
  if (m) { const mn=m[1]||m[4], y=+(m[2]||m[3]), mo=MN[mn]; if(mo) return {year_frac:y+(mo-1)/12,date_label:pad2(mo)+'/'+y,time_label:null,has_time:false}; }
  // yyyy
  m = s.match(/^(\d{4})$/);
  if (m) return { year_frac:+m[1], date_label:m[1], time_label:null, has_time:false };
  return null;
}

function splitLine(line) {
  const r=[]; let cur='', inQ=false;
  for (const ch of line) {
    if(ch==='"'||ch==="'"){inQ=!inQ;continue;}
    if(!inQ&&/[,;\t]/.test(ch)){r.push(cur.trim());cur='';}
    else cur+=ch;
  }
  r.push(cur.trim()); return r;
}

function parseCsv(text, append=false) {
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
  const newEv=[]; let skipped=0;
  for (const line of lines) {
    if(/^date[,;\t]/i.test(line)) continue;
    const parts = splitLine(line);
    if(parts.length<3){skipped++;continue;}
    const [dateStr,category,...rest]=parts;
    const p=parseDate(dateStr);
    if(!p){skipped++;continue;}
    newEv.push({raw_date:dateStr.trim(),year_frac:p.year_frac,date_label:p.date_label,
      time_label:p.time_label,has_time:p.has_time,category:category.trim(),label:rest.join(', ').trim()});
  }
  events = append ? [...events,...newEv] : newEv;
  notify(`Imported ${newEv.length} events${skipped?` (${skipped} skipped)`:''}`, 'ok');
  buildTimeline();
}

function assignCatColors() {
  catMap={};
  [...new Set(events.map(e=>e.category))].forEach((c,i)=>catMap[c]=i%PALETTE.length);
}

function buildTimeline() {
  if(!events.length){
    document.getElementById('canvas-empty').style.display='flex';
    document.getElementById('timeline-canvas').style.display='none';
    document.getElementById('event-list').innerHTML='<div class="empty-state"><div class="empty-icon">📋</div>No events yet</div>';
    document.getElementById('count-badge').textContent='0';
    document.getElementById('legend').innerHTML='';
    return;
  }
  assignCatColors();
  renderSidebar();
  renderLegend();
  renderCanvas();
}

function renderSidebar() {
  document.getElementById('count-badge').textContent=events.length;
  const sorted=[...events].sort((a,b)=>a.year_frac-b.year_frac);
  const list=document.getElementById('event-list');
  list.innerHTML='';
  sorted.forEach(ev=>{
    const color=PALETTE[catMap[ev.category]];
    const timeStr=ev.has_time?`<br><span style="color:var(--accent);font-size:9px">${ev.time_label}</span>`:'';
    const row=document.createElement('div');
    row.className='list-row'; row.style.borderLeftColor=color;
    row.innerHTML=`<div class="list-date">${ev.date_label}${timeStr}</div>
      <div><div class="list-title">${ev.label}</div>
      <div class="list-cat" style="color:${color}">${ev.category}</div></div>`;
    list.appendChild(row);
  });
}

function renderLegend() {
  const leg=document.getElementById('legend'); leg.innerHTML='';
  Object.entries(catMap).forEach(([cat,ci])=>{
    const el=document.createElement('div'); el.className='leg-item';
    el.innerHTML=`<div class="leg-dot" style="background:${PALETTE[ci]}"></div>${cat}`;
    leg.appendChild(el);
  });
}

// ── COLLISION AVOIDANCE ─────────────────────────────────────────────────────
// Given sorted array of x-positions (px) and label width estimate,
// assigns each event a "level" (0,1,2,...) so labels don't overlap.
// Returns array of level indices.
function assignLevels(xPositions, labelWidthPx) {
  const levels = [];
  // track right-edge of last label placed at each level
  const levelEdge = [];
  const halfW = labelWidthPx / 2;

  for (let i = 0; i < xPositions.length; i++) {
    const cx = xPositions[i];
    const lLeft  = cx - halfW;
    const lRight = cx + halfW;

    // find lowest level where this label fits (no overlap with prev on same level)
    let placed = false;
    for (let lv = 0; lv < levelEdge.length; lv++) {
      if (levelEdge[lv] + 8 <= lLeft) { // 8px gap
        levelEdge[lv] = lRight;
        levels.push(lv);
        placed = true;
        break;
      }
    }
    if (!placed) {
      levelEdge.push(lRight);
      levels.push(levelEdge.length - 1);
    }
  }
  return levels;
}

// ── AXIS TICKS with min-pixel spacing ──────────────────────────────────────
function buildTicks(dMin, dMax, W) {
  const span = dMax - dMin;
  const pxPerYear = W / span;

  // candidate intervals in fractional years
  const candidates = [
    1/365.25,    // 1 day
    7/365.25,    // 1 week
    1/12,        // 1 month
    3/12,        // 3 months
    6/12,        // 6 months
    1, 2, 5, 10, 20, 50
  ];

  let interval = candidates[candidates.length-1];
  for (const c of candidates) {
    if (c * pxPerYear >= MIN_TICK_PX) { interval = c; break; }
  }

  const ticks = [];
  // find first tick >= dMin
  const start = Math.ceil(dMin / interval) * interval;
  for (let t = start; t <= dMax + 1e-9; t += interval) {
    const px = (t - dMin) / span * W;
    ticks.push({ yf: t, px, label: formatTickLabel(t, interval) });
  }
  return ticks;
}

function formatTickLabel(yf, interval) {
  const y   = Math.floor(yf);
  const frac = yf - y;
  const totalDays = frac * 365.25;
  const month = Math.floor(frac * 12) + 1;
  const day   = Math.floor((frac * 12 - (month-1)) * 30.44) + 1;

  if (interval < 1/12) {
    // day level
    return pad2(Math.max(1,day))+'.'+pad2(Math.min(12,month));
  } else if (interval < 1) {
    // month level
    const MSHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return MSHORT[Math.min(11,month-1)]+' '+y;
  } else {
    return String(y);
  }
}

// ── LINKED EVENT DETECTION ───────────────────────────────────────────────────
// Two events are "linked" if they share identical date_label + label across
// different categories. Returns Map: linkKey -> [ev, ev, ...]
function detectLinks(evList) {
  const groups = new Map();
  evList.forEach(ev => {
    const key = ev.date_label + '||' + ev.label.toLowerCase().trim();
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(ev);
  });
  // Only keep groups with 2+ different categories
  const links = new Map();
  groups.forEach((evs, key) => {
    const cats = new Set(evs.map(e => e.category));
    if (cats.size >= 2) links.set(key, evs);
  });
  return links; // Map: key -> [ev...]
}

// ── MAIN RENDER ──────────────────────────────────────────────────────────────
function renderCanvas() {
  document.getElementById('canvas-empty').style.display='none';
  const canvas=document.getElementById('timeline-canvas');
  canvas.style.display='block'; canvas.innerHTML='';

  const minYF=Math.min(...events.map(e=>e.year_frac));
  const maxYF=Math.max(...events.map(e=>e.year_frac));
  const pad  =Math.max((maxYF-minYF)*0.06, 0.05);
  const dMin =minYF-pad, dMax=maxYF+pad, span=dMax-dMin;

  const PX_PER_YEAR = Math.max(120, Math.min(300, 1400/span));
  const W = Math.round(span * PX_PER_YEAR);
  canvas.style.width = (W + 100) + 'px';

  const xpx = yf => (yf - dMin) / span * W;

  // Detect linked events before rendering
  const linkGroups = detectLinks(events);
  // Build lookup: ev -> linkKey
  const evLinkKey = new Map();
  linkGroups.forEach((evs, key) => evs.forEach(ev => evLinkKey.set(ev, key)));

  // ── Axis ──
  const axis = document.createElement('div');
  axis.className='year-axis'; axis.style.width=W+'px';
  const axBg=document.createElement('div'); axBg.className='axis-bg'; axis.appendChild(axBg);
  buildTicks(dMin, dMax, W).forEach(t => {
    const tick=document.createElement('div'); tick.className='yr-tick';
    tick.style.left=t.px+'px'; tick.textContent=t.label; axis.appendChild(tick);
  });
  canvas.appendChild(axis);

  // ── Build rows, record trackY per category for connector drawing ──
  const rowsEl=document.createElement('div'); rowsEl.className='tl-rows';
  rowsEl.style.position='relative';
  canvas.appendChild(rowsEl);

  const LABEL_APPROX_W = 120;
  const cats=[...new Set(events.map(e=>e.category))];

  // First pass: compute layout metrics per category
  const catMeta = {}; // cat -> { rowH, trackY, catEv, xPositions }
  cats.forEach(cat => {
    const catEv=[...events.filter(e=>e.category===cat)].sort((a,b)=>a.year_frac-b.year_frac);
    const xPositions = catEv.map(ev => xpx(ev.year_frac));
    const aboveEvs = catEv.filter((_,i)=>i%2===0);
    const belowEvs = catEv.filter((_,i)=>i%2!==0);
    const aboveLevels = assignLevels(aboveEvs.map((_,i)=>xPositions[i*2]), LABEL_APPROX_W);
    const belowLevels = assignLevels(belowEvs.map((_,i)=>xPositions[i*2+1]), LABEL_APPROX_W);
    const maxAbove = aboveLevels.length ? Math.max(...aboveLevels)+1 : 0;
    const maxBelow = belowLevels.length ? Math.max(...belowLevels)+1 : 0;
    const rowH = ROW_PADDING + maxAbove*LEVEL_HEIGHT + DOT_SIZE + maxBelow*LEVEL_HEIGHT + ROW_PADDING;
    const trackY = ROW_PADDING + maxAbove*LEVEL_HEIGHT + DOT_SIZE/2;
    catMeta[cat] = { rowH, trackY, catEv, xPositions, aboveLevels, belowLevels };
  });

  // Compute cumulative Y offsets for each row (for SVG connector positioning)
  // axis height = 28px + 4px margin = 32px
  const AXIS_H = 32;
  const catTopY = {}; // cat -> top Y within rowsEl
  let cumY = 0;
  cats.forEach(cat => {
    catTopY[cat] = cumY;
    cumY += catMeta[cat].rowH;
  });
  const totalRowsH = cumY;

  // ── SVG overlay for cross-row connector lines ──
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.style.cssText = `position:absolute;top:0;left:0;width:${W}px;height:${totalRowsH}px;pointer-events:none;overflow:visible;`;
  rowsEl.appendChild(svg);

  // Collect connector data: linkKey -> [{cat, x, trackAbsY}]
  const connectorPoints = new Map(); // linkKey -> [{cat, x, absY}]

  // ── Second pass: render each row ──
  cats.forEach(cat => {
    const { rowH, trackY, catEv, xPositions, aboveLevels, belowLevels } = catMeta[cat];
    const ci=catMap[cat], color=PALETTE[ci];

    const row=document.createElement('div');
    row.className='tl-row';
    row.style.cssText=`width:${W}px;height:${rowH}px;position:relative;`;

    const lbl=document.createElement('div'); lbl.className='cat-lbl';
    lbl.style.top=trackY+'px';
    lbl.textContent=cat; lbl.style.color=color; row.appendChild(lbl);

    const track=document.createElement('div'); track.className='track';
    track.style.background=color; track.style.top=trackY+'px'; row.appendChild(track);

    let aboveIdx=0, belowIdx=0;
    catEv.forEach((ev, idx) => {
      const isAbove = idx%2===0;
      const cx = xPositions[idx];
      let level, side;
      if (isAbove) { level=aboveLevels[aboveIdx++]; side='above'; }
      else         { level=belowLevels[belowIdx++]; side='below'; }

      const dotTopY = trackY - DOT_SIZE/2;
      let labelTopY, stemTopY, stemH;
      if (side==='above') {
        stemH=STEM_MIN+level*LEVEL_HEIGHT; stemTopY=dotTopY-stemH; labelTopY=stemTopY-LABEL_HEIGHT;
      } else {
        stemTopY=trackY+DOT_SIZE/2; stemH=STEM_MIN+level*LEVEL_HEIGHT; labelTopY=stemTopY+stemH;
      }

      const isLinked = evLinkKey.has(ev);

      const node=document.createElement('div');
      node.className='ev';
      node.style.cssText=`left:${cx}px;top:0;width:1px;animation-delay:${idx*0.04}s;`;

      // dot — diamond shape for linked events
      if (isLinked) {
        const diamond=document.createElement('div');
        diamond.style.cssText=`
          position:absolute;
          width:13px;height:13px;
          background:${color};
          border:2px solid var(--bg);
          transform:rotate(45deg);
          left:${-13/2}px;
          top:${trackY-13/2}px;
          z-index:3;
          transition:transform .15s;
          box-shadow:0 0 0 2px ${color}44;
        `;
        diamond.classList.add('ev-dot');
        node.appendChild(diamond);
        node.addEventListener('mouseenter',()=>{ diamond.style.transform='rotate(45deg) scale(1.5)'; });
        node.addEventListener('mouseleave',()=>{ diamond.style.transform='rotate(45deg) scale(1)'; });
      } else {
        const dot=document.createElement('div'); dot.className='ev-dot';
        dot.style.cssText=`background:${color};border-color:var(--bg);position:absolute;left:${-DOT_SIZE/2}px;top:${dotTopY}px;`;
        node.appendChild(dot);
      }

      // stem
      const stem=document.createElement('div'); stem.className='ev-stem';
      stem.style.cssText=`position:absolute;left:-0.5px;top:${stemTopY}px;height:${stemH}px;`;
      node.appendChild(stem);

      // label
      const lbl2=document.createElement('div'); lbl2.className='ev-lbl';
      lbl2.style.cssText=`position:absolute;top:${labelTopY}px;transform:translateX(-50%);left:0;`;
      if (isLinked) lbl2.style.fontWeight='600';
      const dspan=document.createElement('span'); dspan.className='ev-date-lbl';
      dspan.textContent=ev.has_time?`${ev.date_label} ${ev.time_label}`:ev.date_label;
      lbl2.appendChild(dspan);
      lbl2.appendChild(document.createTextNode(ev.label));
      node.appendChild(lbl2);
      row.appendChild(node);

      // Record connector point (absolute Y = row top + trackY)
      if (isLinked) {
        const key = evLinkKey.get(ev);
        if (!connectorPoints.has(key)) connectorPoints.set(key, []);
        connectorPoints.get(key).push({ cat, x: cx, absY: catTopY[cat] + trackY });
      }

      // tooltip
      node.addEventListener('mouseenter', e=>{
        const tt=document.getElementById('tooltip');
        document.getElementById('tt-t').textContent=ev.label;
        document.getElementById('tt-d').textContent=ev.date_label;
        const ttime=document.getElementById('tt-time');
        if(ev.has_time){ttime.textContent='⏱ '+ev.time_label;ttime.style.display='block';}
        else ttime.style.display='none';
        document.getElementById('tt-c').textContent=ev.category;
        document.getElementById('tt-c').style.color=color;
        const linked = linkGroups.has(evLinkKey.get(ev));
        document.getElementById('tt-c').textContent = linked
          ? ev.category + '  🔗 linked'
          : ev.category;
        tt.style.left=(e.clientX+14)+'px'; tt.style.top=(e.clientY-52)+'px';
        tt.classList.add('show');
      });
      node.addEventListener('mousemove', e=>{
        const tt=document.getElementById('tooltip');
        tt.style.left=(e.clientX+14)+'px'; tt.style.top=(e.clientY-52)+'px';
      });
      node.addEventListener('mouseleave',()=>document.getElementById('tooltip').classList.remove('show'));
    });

    rowsEl.appendChild(row);
  });

  // ── Draw SVG connectors between linked rows ──
  connectorPoints.forEach((points) => {
    if (points.length < 2) return;
    // Sort by absY (top to bottom)
    points.sort((a,b) => a.absY - b.absY);
    const x = points[0].x; // same x for all (same date)

    for (let i = 0; i < points.length - 1; i++) {
      const y1 = points[i].absY;
      const y2 = points[i+1].absY;

      // dashed vertical connector line
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', x); line.setAttribute('y1', y1);
      line.setAttribute('x2', x); line.setAttribute('y2', y2);
      line.setAttribute('stroke', '#ffffff');
      line.setAttribute('stroke-width', '1.5');
      line.setAttribute('stroke-dasharray', '4 4');
      line.setAttribute('stroke-opacity', '0.35');
      svg.appendChild(line);

      // small horizontal tick marks at each endpoint
      [-1, 1].forEach((dir, di) => {
        const yy = di === 0 ? y1 : y2;
        const tick = document.createElementNS('http://www.w3.org/2000/svg','line');
        tick.setAttribute('x1', x-5); tick.setAttribute('y1', yy);
        tick.setAttribute('x2', x+5); tick.setAttribute('y2', yy);
        tick.setAttribute('stroke','#ffffff');
        tick.setAttribute('stroke-width','1.5');
        tick.setAttribute('stroke-opacity','0.5');
        svg.appendChild(tick);
      });
    }
  });

  // Light theme: use dark connector color
  if (html.dataset.theme === 'light') {
    svg.querySelectorAll('line').forEach(l => {
      l.setAttribute('stroke','#444466');
    });
  }
}

});
document.getElementById('excel-file').addEventListener('change',function(){
  const file=this.files[0]; if(!file)return;
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='csv'||ext==='tsv'){
    const r=new FileReader(); r.onload=e=>parseCsv(e.target.result,false); r.readAsText(file);
  } else if(ext==='xlsx'||ext==='xls'){
    const r=new FileReader();
    r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'binary'}); parseCsv(XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]),false);}catch{notify('Could not parse Excel file','err');}};
    r.readAsBinaryString(file);
  }
  this.value='';
});
document.getElementById('clear-btn').addEventListener('click',()=>{events=[];buildTimeline();notify('Cleared','ok');});
document.getElementById('export-btn').addEventListener('click',()=>{
  if(!events.length){notify('Nothing to export','err');return;}
  notify('Rendering PNG…','ok');
  const target = document.getElementById('export-target');
  target.classList.add('exporting');
  // small delay so styles apply before capture
  setTimeout(() => {
    html2canvas(target,{
      backgroundColor: html.dataset.theme==='dark' ? '#0e0f14' : '#f2f3f7',
      scale:2, useCORS:true, logging:false
    }).then(cvs=>{
      target.classList.remove('exporting');
      const a=document.createElement('a'); a.download='timeline.png'; a.href=cvs.toDataURL('image/png'); a.click();
      notify('PNG exported!','ok');
    }).catch(()=>{ target.classList.remove('exporting'); notify('Export failed','err'); });
  }, 80);
});
